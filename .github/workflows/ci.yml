name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --no-self-update

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          gcc --version

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked
