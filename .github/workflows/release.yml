name: Release

# Publishing workflow: pushing a v* tag builds the full Windows package with
# scripts/package.ps1 (the same script used for v1.0.0) and publishes it.
# The release is created as a draft, assets are uploaded, and only then is it
# published, so a failed build or upload never leaves a public, incomplete
# release behind. Day-to-day checks live in ci.yml and are not touched here.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: package & publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --no-self-update

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Tag '$tag' must look like v1.2.3."
          }
          $version = $Matches['version']
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV

          $declared = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($declared -ne $version) {
              Write-Host "::warning title=Version mismatch::Cargo.toml declares $declared but the tag is $tag. Bump the crate version (and Cargo.lock) before tagging so binaries and release match; packaging continues."
          }
          Write-Host "Packaging TabSortLite-Edge-$version for $tag"

      - name: Test
        run: cargo test --release --locked

      - name: Build and package
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -BundleName "TabSortLite-Edge-$env:VERSION"

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = $env:VERSION
          $bundle = "TabSortLite-Edge-$v"
          $files = @(
              "dist/$bundle.zip",
              "dist/$bundle-Source.zip",
              "dist/$bundle-SHA256.txt"
          )
          foreach ($file in $files) {
              if (-not (Test-Path -LiteralPath $file)) { throw "Missing artifact: $file" }
              Write-Host ("{0} ({1:N1} MB)" -f $file, ((Get-Item -LiteralPath $file).Length / 1MB))
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath "dist/$bundle.zip").Path)
          try {
              $entries = $zip.Entries.FullName
              foreach ($required in @("$bundle/TabSortLite.exe", "$bundle/extension/manifest.json", "$bundle/models/tokenizer.json")) {
                  if ($entries -notcontains $required) { throw "Bundle is missing $required" }
              }
              Write-Host "Bundle contains $($entries.Count) entries including the EXE, extension and model files."
          } finally {
              $zip.Dispose()
          }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $v = $env:VERSION

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
              if ($existing.isDraft) {
                  Write-Host "Removing leftover draft release for $tag"
                  gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
              } else {
                  throw "Release $tag is already published."
              }
          }

          $templatePath = Join-Path $PWD 'docs/release-notes-template.md'
          if (-not (Test-Path -LiteralPath $templatePath)) { throw "Missing $templatePath" }
          $template = [System.IO.File]::ReadAllText($templatePath, [System.Text.UTF8Encoding]::new($false))
          $notes = $template.Replace('{{VERSION}}', $v)
          [System.IO.File]::WriteAllText("$PWD/release-notes.md", $notes, [System.Text.UTF8Encoding]::new($false))
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --title "TabSort Lite $v" --notes-file release-notes.md

      - name: Upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $v = $env:VERSION
          gh release upload $tag --repo $env:GITHUB_REPOSITORY `
              "dist/TabSortLite-Edge-$v.zip" `
              "dist/TabSortLite-Edge-$v-Source.zip" `
              "dist/TabSortLite-Edge-$v-SHA256.txt"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $assets = (gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          if ($assets.Count -ne 3) {
              throw "Expected 3 uploaded assets, found $($assets.Count). Release left as draft."
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          Write-Host "Published $tag with $($assets.Count) assets."
